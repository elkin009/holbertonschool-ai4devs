openapi: 3.0.3
info:
  title: Task Management API
  description: Robust API with JWT, Pagination, and full CRUD.
  version: 1.0.0
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
paths:
  /tasks:
    get:
      summary: List all tasks (with pagination)
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
    post:
      summary: Create a task
      responses:
        '201':
          description: Created
  /tasks/{id}:
    get:
      summary: Get task details
      responses:
        '200':
          description: OK
        '404':
          description: Not Found
    put:
      summary: Update a task
      responses:
        '200':
          description: Updated
    delete:
      summary: Delete a task
      responses:
        '204':
          description: Deleted
